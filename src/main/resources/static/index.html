<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recordatorio de Medicación (2 tomas)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Sistema de diseño mejorado */
    :root {
      /* Colores principales */
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f9fafb;
      --card: #ffffff;
      --border: #e5e7eb;
      --border-hover: #d1d5db;
      --text: #111827;
      --text-muted: #6b7280;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #ef4444;
      --warning-light: #fef2f2;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --transition: all 0.2s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #4f46e5, #818cf8);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .now {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    input[type="time"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      transition: var(--transition);
      color: var(--text);
    }

    input[type="time"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    button.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: #f9fafb;
      border-color: var(--border-hover);
    }

    .status {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
    }

    .badge.ok {
      background: var(--success-light);
      color: var(--success);
    }

    .badge.pending {
      background: var(--warning-light);
      color: var(--warning);
    }

    .toggle-btn {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 6px;
      background: white;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
    }

    .toggle-btn:hover {
      background: #f9fafb;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    .modal {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      padding: 24px;
      box-shadow: var(--shadow-md);
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 0.3s ease-out forwards;
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
      color: var(--text);
    }

    .modal p {
      margin-bottom: 24px;
      color: var(--text-muted);
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }
      
      .container {
        padding: 24px 20px;
      }
      
      .button-group {
        flex-direction: column;
      }
      
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recordatorio de Medicación</h1>
    <div class="now">
      <span id="nowText">--</span>
    </div>

    <div class="group">
      <label for="time1">Hora de primera toma</label>
      <input id="time1" type="time" aria-label="Seleccionar hora para la primera toma" />
    </div>

    <div class="group">
      <label for="time2">Hora de segunda toma</label>
      <input id="time2" type="time" aria-label="Seleccionar hora para la segunda toma" />
    </div>

    <div class="button-group">
      <button id="saveBtn" class="primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Guardar
      </button>
      <button id="enableSoundBtn" class="secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <span id="soundStatus">Habilitar sonido</span>
      </button>
    </div>

    <div class="status">
      <h2>Estado de las tomas</h2>
      <div class="status-item">
        <div>
          <div class="status-label">Primera toma</div>
          <div class="status-time" id="time1Display">--:--</div>
        </div>
        <div class="status-actions">
          <span id="status1Badge" class="badge pending">Pendiente</span>
          <button id="toggle1Btn" class="toggle-btn">Marcar</button>
        </div>
      </div>
      
      <div class="status-item">
        <div>
          <div class="status-label">Segunda toma</div>
          <div class="status-time" id="time2Display">--:--</div>
        </div>
        <div class="status-actions">
          <span id="status2Badge" class="badge pending">Pendiente</span>
          <button id="toggle2Btn" class="toggle-btn">Marcar</button>
        </div>
      </div>
    </div>

    <div class="footer" style="display: none;">
      <p>Recordatorio de medicación v1.0.0</p>
    </div>
  </div>

  <!-- Overlay de alerta visual -->
  <div id="alarmOverlay" class="overlay" role="dialog" aria-modal="true">
    <div class="box">
      <h2>¡Es hora del medicamento!</h2>
      <p id="whichDoseText"></p>
      <div style="display:flex; gap:8px; justify-content:center; margin-top:12px;">
        <button id="ackBtn" class="primary">Entendido</button>
      </div>
    </div>
  </div>

  <div id="modalOverlay" class="overlay" role="dialog" aria-modal="true">
    <div class="box">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div style="display:flex; gap:8px; justify-content:center; margin-top:12px;">
        <button id="modalOkBtn" class="primary">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Audio de alarma -->
  <audio id="alarmAudio" preload="auto" playsinline>
    <source id="alarmSource" src="" type="audio/mpeg" />
  </audio>

  <script>
    // ===== Claves de almacenamiento (SRP: configuración) =====
    const LS_KEYS = {
      time1: 'med_time_1',
      time2: 'med_time_2',
      dose1done: 'med_dose1_done',
      dose2done: 'med_dose2_done',
      lastAlarmFor: 'med_last_alarm_for' // '1@YYYY-MM-DD' o '2@YYYY-MM-DD'
    };

    // Nombre real del archivo de audio presente en /static (evita 404)
    const AUDIO_FILE = 'Grupofirme.mp3';
    const AUDIO_URL = encodeURI(AUDIO_FILE);

    // ===== Utilidades de tiempo (SRP: solo manejo de fechas/horas) =====
    const timeUtils = {
      now() { return new Date(); },
      pad(n) { return String(n).padStart(2, '0'); },
      toHHMM(d) { return `${this.pad(d.getHours())}:${this.pad(d.getMinutes())}`; },
      todayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${this.pad(d.getMonth()+1)}-${this.pad(d.getDate())}`;
      },
      equalsHHMMNow(hhmm) {
        if (!hhmm) return false;
        const now = this.now();
        const current = this.toHHMM(now);
        return current === hhmm;
      }
    };

    // ===== Servicio de almacenamiento (SRP: solo localStorage) =====
    const storageService = {
      get(key, def=null) { try { const v = localStorage.getItem(key); return v ?? def; } catch { return def; } },
      set(key, val) { try { localStorage.setItem(key, val); } catch {} },
      setBool(key, val) { this.set(key, val ? '1' : '0'); },
      getBool(key, def=false) {
        const v = this.get(key, null);
        if (v === null) return def;
        return v === '1';
      }
    };

    // Servicio de recursos para verificar disponibilidad de alarm.mp3
    const resourceService = {
      async probeAlarm(soundStatusEl) {
        try {
          const res = await fetch(AUDIO_URL + '?probe=' + Date.now(), { cache: 'no-store' });
          const ok = res.ok;
          console.log('[alarm] probe alarm.mp3 status=', res.status);
          if (soundStatusEl) soundStatusEl.textContent = ok ? 'Audio disponible (HTTP ' + res.status + ')' : 'Audio no disponible (HTTP ' + res.status + ')';
          return ok;
        } catch (e) {
          console.warn('[alarm] error probe alarm.mp3', e);
          if (soundStatusEl) soundStatusEl.textContent = 'Error verificando audio: ' + (e && e.message ? e.message : e);
          return false;
        }
      }
    };

    // ===== Servicio de modal (SRP: solo mostrar/ocultar modal genérico) =====
    const modalService = (function(){
      let overlay, titleEl, textEl, okBtn;
      function init(){
        overlay = document.getElementById('modalOverlay');
        titleEl = document.getElementById('modalTitle');
        textEl = document.getElementById('modalText');
        okBtn = document.getElementById('modalOkBtn');
        if (okBtn) okBtn.addEventListener('click', hide);
      }
      function show(title, text){
        if (!overlay) init();
        titleEl.textContent = title;
        textEl.textContent = text;
        overlay.style.display = 'flex';
      }
      function hide(){
        if (!overlay) return;
        overlay.style.display = 'none';
      }
      return { init, show, hide };
    })();
    // Exponer en window para evitar ReferenceError en handlers
    try { window.modalService = modalService; } catch(e) {}

    // ===== Servicio de audio/alarma (SRP: solo reproducir y gestionar alarma) =====
    const alarmService = (function(){
      let audioEl, overlayEl, whichDoseTextEl, enabled = false, currentDoseIndex = null;

      function init() {
        audioEl = document.getElementById('alarmAudio');
        const srcTag = document.getElementById('alarmSource');
        if (srcTag) { srcTag.src = AUDIO_URL; }
        try { audioEl.load(); } catch {}
        try { audioEl.volume = 1.0; } catch {}
        overlayEl = document.getElementById('alarmOverlay');
        whichDoseTextEl = document.getElementById('whichDoseText');
      }

      async function enableAudioByUserGesture() {
        // Debe llamarse en respuesta a un gesto del usuario para desbloquear autoplay
        try {
          console.log('[alarm] intentando habilitar audio');
          audioEl.load();
          audioEl.muted = true;
          await audioEl.play();
          audioEl.pause();
          audioEl.currentTime = 0;
          audioEl.muted = false;
          enabled = true;
          console.log('[alarm] audio habilitado');
          document.dispatchEvent(new CustomEvent('alarm-enabled', { detail: { enabled: true } }));
          alert('Sonido habilitado. La alarma podrá reproducirse automáticamente.');
        } catch (e) {
          enabled = false;
          console.warn('[alarm] fallo habilitar audio', e);
          document.dispatchEvent(new CustomEvent('alarm-enabled', { detail: { enabled: false } }));
          alert('No se pudo habilitar el sonido. Intenta nuevamente haciendo clic en "Habilitar sonido".');
        }
      }

      async function notifyAndPlay(doseLabel, doseIndex) {
        whichDoseTextEl.textContent = doseLabel;
        overlayEl.style.display = 'flex';
        currentDoseIndex = doseIndex;
        try {
          console.log('[alarm] reproduciendo alarma');
          try { audioEl.muted = false; } catch {}
          try { audioEl.volume = 1.0; } catch {}
          try { audioEl.currentTime = 0; } catch {}
          try { audioEl.load(); } catch {}
          await audioEl.play();
        } catch (e) {
          // Si falla el autoplay, al menos mostramos el overlay
          console.warn('No se pudo reproducir el audio automáticamente:', e);
        }
      }

      function stopAndHide() {
        try { audioEl.pause(); audioEl.currentTime = 0; } catch {}
        overlayEl.style.display = 'none';
      }

      function isEnabled() { return enabled; }
      function getCurrentDoseIndex() { return currentDoseIndex; }

      return { init, enableAudioByUserGesture, notifyAndPlay, stopAndHide, isEnabled, getCurrentDoseIndex };
    })();

    // ===== Estado de UI (SRP: solo mantener estado en memoria) =====
    const uiState = {
      time1: '',
      time2: '',
      dose1done: false,
      dose2done: false
    };

    // ===== Controlador de UI (SRP: solo manipular DOM y eventos) =====
    const uiController = (function(){
      let nowText, time1El, time2El, saveBtn, enableSoundBtn, status1Badge, status2Badge, toggle1Btn, toggle2Btn, ackBtn;

      function init() {
        nowText = document.getElementById('nowText');
        time1El = document.getElementById('time1');
        time2El = document.getElementById('time2');
        saveBtn = document.getElementById('saveBtn');
        enableSoundBtn = document.getElementById('enableSoundBtn');
        status1Badge = document.getElementById('status1Badge');
        status2Badge = document.getElementById('status2Badge');
        toggle1Btn = document.getElementById('toggle1Btn');
        toggle2Btn = document.getElementById('toggle2Btn');
        ackBtn = document.getElementById('ackBtn');
        const soundStatus = document.getElementById('soundStatus');

        time1El.addEventListener('change', () => {
          uiState.time1 = time1El.value || '';
          storageService.set(LS_KEYS.time1, uiState.time1);
          console.log('[alarm] time1 actualizado a', uiState.time1);
        });
        time2El.addEventListener('change', () => {
          uiState.time2 = time2El.value || '';
          storageService.set(LS_KEYS.time2, uiState.time2);
          console.log('[alarm] time2 actualizado a', uiState.time2);
        });

        saveBtn.addEventListener('click', onSave);
        enableSoundBtn.addEventListener('click', async () => {
          const prevText = enableSoundBtn.textContent;
          enableSoundBtn.textContent = 'Habilitando…';
          enableSoundBtn.disabled = true;
          soundStatus.textContent = 'Intentando habilitar sonido…';
          try {
            const available = await resourceService.probeAlarm(soundStatus);
            if (!available) {
              throw new Error('alarm.mp3 no accesible');
            }
            const bust = AUDIO_URL + '?ts=' + Date.now();
            const srcEl = document.querySelector('#alarmAudio source');
            if (srcEl) srcEl.src = bust;
            document.getElementById('alarmAudio').load();
            await alarmService.enableAudioByUserGesture();
          } finally {
            if (!alarmService.isEnabled || !alarmService.isEnabled()) {
              enableSoundBtn.textContent = prevText;
              enableSoundBtn.disabled = false;
              enableSoundBtn.classList.add('primary');
              soundStatus.textContent = 'No se pudo habilitar el sonido. Intenta nuevamente.';
            }
          }
        });
        toggle1Btn.addEventListener('click', () => toggleDose(1));
        toggle2Btn.addEventListener('click', () => toggleDose(2));
        ackBtn.addEventListener('click', onAckAlarm);

        document.addEventListener('alarm-enabled', (e) => {
          const on = !!(e.detail && e.detail.enabled);
          enableSoundBtn.textContent = on ? 'Sonido habilitado' : 'Habilitar sonido';
          enableSoundBtn.disabled = on;
          if (on) { enableSoundBtn.classList.remove('primary'); } else { enableSoundBtn.classList.add('primary'); }
          const soundStatus = document.getElementById('soundStatus');
          soundStatus.textContent = on ? 'Sonido habilitado correctamente.' : 'No se pudo habilitar el sonido.';
        });

        if (alarmService.isEnabled && alarmService.isEnabled()) {
          enableSoundBtn.textContent = 'Sonido habilitado';
          enableSoundBtn.disabled = true;
          enableSoundBtn.classList.remove('primary');
        }
      }

      function renderClock() {
        const now = timeUtils.now();
        nowText.textContent = now.toLocaleString();
      }

      function renderForm() {
        time1El.value = uiState.time1 || '';
        time2El.value = uiState.time2 || '';
      }

      function renderStatus() {
        const time1Display = document.getElementById('time1Display');
        const time2Display = document.getElementById('time2Display');
        
        // Mostrar las horas configuradas
        time1Display.textContent = uiState.time1 || '--:--';
        time2Display.textContent = uiState.time2 || '--:--';
        
        // Actualizar estado de la primera toma
        status1Badge.textContent = uiState.dose1done ? 'Tomada' : 'Pendiente';
        status1Badge.className = 'badge ' + (uiState.dose1done ? 'ok' : 'pending');
        toggle1Btn.textContent = uiState.dose1done ? 'Deshacer' : 'Marcar';
        
        // Actualizar estado de la segunda toma
        status2Badge.textContent = uiState.dose2done ? 'Tomada' : 'Pendiente';
        status2Badge.className = 'badge ' + (uiState.dose2done ? 'ok' : 'pending');
        toggle2Btn.textContent = uiState.dose2done ? 'Deshacer' : 'Marcar';
      }

      function onSave() {
        uiState.time1 = time1El.value || '';
        uiState.time2 = time2El.value || '';
        const ms = (typeof modalService !== 'undefined' && modalService) || (typeof window !== 'undefined' && window.modalService) || null;
        if (!uiState.time1 || !uiState.time2) {
          const def1 = '08:00';
          const def2 = '20:00';
          uiState.time1 = uiState.time1 || def1;
          uiState.time2 = uiState.time2 || def2;
          if (uiState.time1 === uiState.time2) { uiState.time2 = def2; }
          time1El.value = uiState.time1;
          time2El.value = uiState.time2;
        }
        if (uiState.time1 === uiState.time2) {
          if (ms && ms.show) { ms.show('Información', 'La hora inicial no puede ser igual a la hora final.'); }
          else { alert('Información\nLa hora inicial no puede ser igual a la hora final.'); }
          return;
        }
        storageService.set(LS_KEYS.time1, uiState.time1);
        storageService.set(LS_KEYS.time2, uiState.time2);
        if (ms && ms.show) { ms.show('Información', 'Su horario fue guardado con exito.'); }
        else { alert('Información\nSu horario fue guardado con exito.'); }
      }

      function toggleDose(n) {
        if (n === 1) {
          uiState.dose1done = !uiState.dose1done;
          storageService.setBool(LS_KEYS.dose1done, uiState.dose1done);
          if (!uiState.dose1done) {
            uiState.dose2done = false;
            storageService.setBool(LS_KEYS.dose2done, uiState.dose2done);
          }
        } else {
          if (!uiState.dose1done) { return; }
          uiState.dose2done = !uiState.dose2done;
          storageService.setBool(LS_KEYS.dose2done, uiState.dose2done);
          if (uiState.dose2done) {
            resetDailyState();
          }
        }
        renderStatus();
      }

      function onAckAlarm() {
        const idx = alarmService.getCurrentDoseIndex ? alarmService.getCurrentDoseIndex() : null;
        alarmService.stopAndHide();
        if (idx === 1) {
          uiState.dose1done = true;
          storageService.setBool(LS_KEYS.dose1done, true);
          renderStatus();
        } else if (idx === 2) {
          uiState.dose2done = true;
          storageService.setBool(LS_KEYS.dose2done, true);
          renderStatus();
          resetDailyState();
        }
      }

      return { init, renderClock, renderForm, renderStatus };
    })();

    // ===== Verificador de alarmas (SRP: solo lógica de verificación cada 30s) =====
    const alarmChecker = (function(){
      function alreadyRangFor(doseIndex) {
        const last = storageService.get(LS_KEYS.lastAlarmFor, '');
        return last === `${doseIndex}@${timeUtils.todayKey()}`;
      }
      function setRangFor(doseIndex) {
        storageService.set(LS_KEYS.lastAlarmFor, `${doseIndex}@${timeUtils.todayKey()}`);
      }

      async function check() {
        if (!alarmService.isEnabled || !alarmService.isEnabled()) {
          console.log('[alarm] audio no habilitado, omitiendo verificación');
          return;
        }
        // Primera toma
        if (timeUtils.equalsHHMMNow(uiState.time1) && !alreadyRangFor(1)) {
          console.log('[alarm] coincidencia detectada: primera toma');
          await alarmService.notifyAndPlay('Primera toma', 1);
          setRangFor(1);
        }
        // Segunda toma
        if (timeUtils.equalsHHMMNow(uiState.time2) && !alreadyRangFor(2)) {
          console.log('[alarm] coincidencia detectada: segunda toma');
          await alarmService.notifyAndPlay('Segunda toma', 2);
          setRangFor(2);
        }
      }

      function start() {
        // Ejecuta al inicio y luego cada 30s
        console.log('[alarm] iniciando verificador. t1=', uiState.time1, ' t2=', uiState.time2);
        check();
        setInterval(check, 30 * 1000);
      }

      return { start };
    })();

    // ===== Orquestador de app (SRP: inicialización y coordinación) =====
    (function app(){
      // Inicializar servicios
      alarmService.init();
      if (typeof modalService !== 'undefined' && modalService && modalService.init) { modalService.init(); }
      uiController.init();

      // Cargar estado desde localStorage
      uiState.time1 = storageService.get(LS_KEYS.time1, '');
      uiState.time2 = storageService.get(LS_KEYS.time2, '');
      uiState.dose1done = storageService.getBool(LS_KEYS.dose1done, false);
      uiState.dose2done = storageService.getBool(LS_KEYS.dose2done, false);

      const today = timeUtils.todayKey();
      const lastDate = storageService.get('med_state_date', '');
      if (lastDate !== today) {
        if (typeof resetDailyState === 'function') {
          resetDailyState();
        } else {
          uiState.dose1done = false;
          uiState.dose2done = false;
          storageService.setBool(LS_KEYS.dose1done, false);
          storageService.setBool(LS_KEYS.dose2done, false);
          storageService.set(LS_KEYS.lastAlarmFor, '');
          uiController.renderStatus();
        }
        storageService.set('med_state_date', today);
      }

      if (!uiState.time1 || !uiState.time2) {
        const def1 = '08:00';
        const def2 = '20:00';
        uiState.time1 = uiState.time1 || def1;
        uiState.time2 = uiState.time2 || def2;
        if (uiState.time1 === uiState.time2) { uiState.time2 = def2; }
        storageService.set(LS_KEYS.time1, uiState.time1);
        storageService.set(LS_KEYS.time2, uiState.time2);
      }

      // Render inicial
      uiController.renderForm();
      uiController.renderStatus();
      uiController.renderClock();
      setInterval(uiController.renderClock, 1000);

      // Iniciar verificador de alarmas
      alarmChecker.start();

      // Ejemplo de uso del backend (opcional)
      // fetch('/api/time').then(r => r.json()).then(console.log).catch(console.warn);
    })();
  </script>
